<!doctype html>
<html><head><meta charset="utf-8"><title>Excel 100x Pro</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:"Segoe UI Variable","Segoe UI",sans-serif;background:#fff}
  .t{display:flex;align-items:center;gap:12px;height:100%;box-sizing:border-box;padding:0 18px;border-left:6px solid #4F46E5;background:linear-gradient(90deg,#EEF2FF,#fff)}
  .t.err{border-color:#DC2626;background:linear-gradient(90deg,#FEF2F2,#fff)}
  .i{font-size:26px}.m{font-size:14px;font-weight:600;color:#1F2937;line-height:1.3}.b{font-size:11px;color:#6B7280;font-weight:400}
  .bar{position:fixed;left:0;bottom:0;height:3px;background:#4F46E5;animation:w 2.4s linear forwards}
  @keyframes w{from{width:100%}to{width:0}}
</style></head>
<body>
<div class="t" id="t"><div class="i" id="i">⚡</div><div class="m"><div id="m"></div><div class="b">Excel 100x Pro</div></div></div><div class="bar"></div>
<script>
  const q = new URLSearchParams(location.search), err = q.get('k') === 'err';
  document.getElementById('m').textContent = q.get('m');
  document.getElementById('i').textContent = err ? '⚠️' : '✅';
  if (err) document.getElementById('t').className = 't err';
  Office.onReady(() => setTimeout(() => Office.context.ui.messageParent('close'), err ? 4200 : 2400));
</script></body></html>
